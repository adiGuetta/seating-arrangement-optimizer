server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    location /about.html {
        alias /static/about.html;
    }

    location /demo-event.json {
        alias /static/demo-event.json;
    }

    location /gifs/ {
        alias /static/gifs/;
    }

    location / {
        proxy_pass http://seating-ui:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /solve {
        proxy_pass http://seating-solver:5050/solve;
        proxy_read_timeout 620s;
    }

    location /health {
        proxy_pass http://seating-solver:5050/health;
    }
}
